<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c141f"/>
      <stop offset="60%" stop-color="#06090e"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="kp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4facfe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="kp-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73fff7"/>
      <stop offset="40%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="kp-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#73fff7"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="kp-neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <radialGradient id="kp-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="kp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00f2fe" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Cyber Armor Badge -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#kp-bg)" stroke="url(#kp-border)" stroke-width="1.5"/>
  <!-- Ambient Core Glow -->
  <circle cx="32" cy="30" r="24" fill="url(#kp-glow)"/>

  <!-- High-Tech Kraken Crest / Cyber Emblem -->
  <g filter="url(#kp-shadow)">
    <!-- Central Kraken Mantle Crown Spine -->
    <path d="M32 9L36.5 17.5L34 23H30L27.5 17.5L32 9Z" fill="url(#kp-core)"/>
    <!-- Cyber Eye Core (Diamond Power Crystal) -->
    <polygon points="32,25 36.5,31 32,37 27.5,31" fill="#ffffff"/>
    <polygon points="32,27 35,31 32,35 29,31" fill="url(#kp-neon)"/>

    <!-- Left Upper Tentacle Wing -->
    <path d="M26 18C20 18 13 22 11 29C10 32.5 12 34 14.5 32C17 30 20 27 24.5 27L27 31L23 35C18 36 13 39 12 43.5C11 47 14 47.5 16.5 45.5C20 42.5 24 39 29 38L30 43L27 50C25 53.5 28 54 30.5 52C32 50.5 33 46 32 41L32 37" fill="none" stroke="url(#kp-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Upper Tentacle Wing (Monogram 'K' Silhouette) -->
    <path d="M38 18C44 18 51 22 53 29C54 32.5 52 34 49.5 32C47 30 44 27 39.5 27L37 31L41 35C46 36 51 39 52 43.5C53 47 50 47.5 47.5 45.5C44 42.5 40 39 35 38L34 43L37 50C39 53.5 36 54 33.5 52C32 50.5 31 46 32 41L32 37" fill="none" stroke="url(#kp-cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Power Nodes (Bioluminescent Sensors) -->
    <circle cx="13" cy="27" r="1.5" fill="#73fff7"/>
    <circle cx="51" cy="27" r="1.5" fill="#73fff7"/>
    <circle cx="14" cy="41" r="1.4" fill="#38ef7d"/>
    <circle cx="50" cy="41" r="1.4" fill="#38ef7d"/>
    <circle cx="28" cy="51.5" r="1.2" fill="#73fff7"/>
    <circle cx="36" cy="51.5" r="1.2" fill="#73fff7"/>
  </g>
</svg>
