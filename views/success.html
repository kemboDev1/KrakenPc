<section class="container success-wrap">
  <canvas class="confetti" data-confetti aria-hidden="true"></canvas>
  <div class="success-check"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="m15 27 8 8 15-17"/></svg></div>
  <p class="eyebrow"><span class="eyebrow-rule"></span>KrakenPC</p>
  <h1>{{orderSuccessTitle}}</h1>
  <p class="success-intro">{{orderSuccessText}}</p>
  <div class="success-order">
    <div class="success-id">
      <span>{{orderNumberLabel}}</span>
      <strong>{{orderId}}</strong>
    </div>
    {{{itemsHtml}}}
    {{{totalHtml}}}
  </div>
  <p class="form-help">{{telegramState}}</p>
  <a class="button button-primary button-lg" href="/">{{returnHomeLabel}} {{{iconArrow}}}</a>
</section>
