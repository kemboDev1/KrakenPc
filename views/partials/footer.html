<footer class="site-footer">
  <div class="container footer-top">
    <a href="{{homeUrl}}" class="brand footer-brand" aria-label="KrakenPC">
      <div class="brand-mark-wrap">
        <img class="brand-mark" src="/favicon.png" alt="" width="42" height="42" decoding="async" loading="lazy">
      </div>
      <div class="brand-text">
        <span class="brand-logotype">KRAKEN<span class="brand-accent">PC</span></span>
        <small class="brand-tagline">PERFORMANCE, BUILT RIGHT</small>
      </div>
    </a>
    <div class="footer-center">
      <p class="footer-promise">{{footerSignature}}</p>
      <p class="footer-policy-text">{{footerPolicy}}</p>
    </div>
    <div class="footer-end">
      <a class="footer-admin" href="/admin">{{adminTitle}}</a>
    </div>
  </div>
  <div class="container footer-bottom">
    <span class="footer-copy">© {{year}} KrakenPC. Barcha huquqlar himoyalangan.</span>
    <span class="footer-region"><span class="live-dot pulse"></span>{{region}}</span>
    <a class="footer-catalog-link" href="{{catalogUrl}}">{{navCatalog}}</a>
  </div>
</footer>
