<footer class="site-footer">
  <div class="container footer-top">
    <a href="{{homeUrl}}" class="brand footer-brand" aria-label="KrakenPC">
      <img class="brand-mark" src="/favicon.png" alt="" width="42" height="42" decoding="async" loading="lazy">
      <span>KRAKEN<span class="brand-accent">PC</span><small>PERFORMANCE, BUILT RIGHT</small></span>
    </a>
    <div>
      <p class="footer-promise">{{footerSignature}}</p>
      <p>{{footerPolicy}}</p>
    </div>
    <a class="footer-admin" href="/admin">{{adminTitle}}</a>
  </div>
  <div class="container footer-bottom">
    <span>© {{year}} KrakenPC</span>
    <span>{{region}}</span>
    <a href="{{catalogUrl}}">{{navCatalog}}</a>
  </div>
</footer>
