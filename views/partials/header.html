<a class="skip-link" href="#main-content">{{skipText}}</a>
<div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>
<header class="site-header" data-site-header>
  <div class="topbar">
    <div class="container topbar-inner">
      <p class="topbar-note"><span class="live-dot" aria-hidden="true"></span>{{region}}</p>
      <p class="topbar-free">{{{iconTruck}}}<span>{{freeFrom}}</span></p>
      <div class="topbar-tools">
        <nav class="lang-switch" aria-label="{{langLabel}}">{{{langLinksHtml}}}</nav>
        <a class="theme-toggle-btn" href="{{themeHref}}" data-theme-toggle aria-label="{{themeToggleLabel}}" title="{{themeToggleLabel}}">
          <span class="theme-icon-sun">{{{iconSun}}}</span><span class="theme-icon-moon">{{{iconMoon}}}</span>
        </a>
      </div>
    </div>
  </div>
  <div class="mainbar">
    <div class="container mainbar-inner">
      <a href="{{homeUrl}}" class="brand" aria-label="KrakenPC — {{navHome}}">
        <img class="brand-mark" src="/favicon.svg" alt="" width="40" height="40" decoding="async" fetchpriority="high">
        <span class="brand-text"><span class="brand-name">KRAKEN<span class="brand-accent">PC</span></span><small>PERFORMANCE, BUILT RIGHT</small></span>
      </a>
      <nav class="main-nav" aria-label="{{navLabel}}">{{{navLinksHtml}}}</nav>
      <div class="header-actions">
        <button type="button" class="search-trigger" data-open-palette aria-label="{{paletteTitle}}" title="{{shortcutTip}}">
          {{{iconSearch}}}<span class="search-trigger-label">{{searchAction}}</span><kbd>Ctrl K</kbd>
        </button>
        <a class="icon-btn hide-sm" href="{{compareUrl}}" aria-label="{{navCompare}}" title="{{navCompare}}">{{{iconCompare}}}<b class="count-badge" data-compare-count>{{compareCountDisplay}}</b></a>
        <a class="icon-btn hide-sm" href="{{favoritesUrl}}" aria-label="{{navFavorites}}" title="{{navFavorites}}">{{{iconHeart}}}<b class="count-badge" data-fav-count>{{favCountDisplay}}</b></a>
        <a class="cart-btn" href="{{cartUrl}}" aria-label="{{navCart}}" data-cart-target>
          {{{iconCart}}}<span class="cart-label">{{navCart}}</span><b class="count-badge" data-cart-count>{{cartCount}}</b>
        </a>
      </div>
    </div>
  </div>
</header>
