<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="{{theme}}">
  <title>{{title}} · KrakenPC</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="application-name" content="KrakenPC">
  <meta name="apple-mobile-web-app-title" content="KrakenPC">
  <meta name="format-detection" content="telephone=no">
  {{{robotsTag}}}
  {{{canonicalTags}}}
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="KrakenPC">
  <meta property="og:locale" content="{{ogLocale}}">
  {{{ogUrlTag}}}
  <meta property="og:title" content="{{title}} · KrakenPC">
  <meta property="og:description" content="{{description}}">
  {{{ogImageTag}}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}} · KrakenPC">
  <meta name="twitter:description" content="{{description}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/mask-icon.svg" color="#22b6ff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{{preloadHtml}}}
  <link rel="stylesheet" href="{{cssUrl}}">
  <script nonce="{{nonce}}">document.documentElement.classList.add('js')</script>
  {{{schemaTags}}}
</head>
<body class="page-{{pageKey}}">
  {{{headerHtml}}}
  <main id="main-content" tabindex="-1">
    {{{content}}}
  </main>
  {{{footerHtml}}}
  {{{mobileNavHtml}}}
  {{{modalsHtml}}}
  {{{bootTag}}}
  <script src="{{jsUrl}}" defer></script>
</body>
</html>
